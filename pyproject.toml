[project]
name = "drawing-quality"
version = "0.1.0"
description = "Quality metrics for straight-line drawings of lattice diagrams (FCA line diagrams)"
readme = "README.md"
authors = [
    { name = "Marcel Nöhre", email = "noehre@cs.uni-kassel.de" },
]
requires-python = ">=3.12"
dependencies = [
    "dim-flux>=1.0.7",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.3",
    "odis-python==2026.9.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lattice_metrics"]
